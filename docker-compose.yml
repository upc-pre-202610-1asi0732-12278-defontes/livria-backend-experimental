# MySQL local estándar (livriadb, puerto 3306). NO usar para experimental.
# Experimental: docker compose -f docker-compose.experimental.yml up -d
services:
  mysql:
    image: mysql:8.4
    container_name: livria-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: livria_local_root
      MYSQL_DATABASE: livriadb
    volumes:
      - livria_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-plivria_local_root"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  livria_mysql_data:
