# MySQL SOLO para entorno experimental (puerto 3307, no choca con livria-mysql en 3306).
# Uso:
#   docker compose -f docker-compose.experimental.yml up -d
#   .\migrate.ps1
#
name: livria-experimental

services:
  mysql:
    image: mysql:8.4
    container_name: livria-mysql-experimental
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: livria_exp_root
      MYSQL_DATABASE: livriadb_experimental
    volumes:
      - livria_mysql_experimental_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-plivria_exp_root"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

volumes:
  livria_mysql_experimental_data:
